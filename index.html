<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✈️ 飞行单词棋 · 八年级上册英语闯关</title>
<style>
  :root{
    --sky1:#bfe9ff; --sky2:#eaf7ff; --ink:#2b3a4a; --card:#ffffff;
    --spell:#ff8a3d; --mean:#27c19a; --gram:#8b6cf0; --reward:#ffc83d;
    --start:#3ec46d; --end:#ff5d6c; --line:#d7e6f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",-apple-system,"Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--sky1),var(--sky2));
    min-height:100vh; padding:18px;
  }
  .wrap{max-width:1040px;margin:0 auto;}
  header{text-align:center;margin-bottom:14px;}
  header h1{margin:0;font-size:26px;letter-spacing:1px;}
  header p{margin:6px 0 0;color:#5d7081;font-size:14px;}
  .hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .stat{background:var(--card);border-radius:14px;padding:10px 16px;min-width:96px;
    text-align:center;box-shadow:0 4px 14px rgba(60,110,160,.12);}
  .stat .num{font-size:22px;font-weight:800;line-height:1;}
  .stat .lab{font-size:12px;color:#7c8c9a;margin-top:4px;}
  .stat.score .num{color:#ff8a3d;}
  .stat.prog .num{color:#27c19a;}
  .stat.acc .num{color:#8b6cf0;}

  .game{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .board-box{flex:1 1 460px;max-width:560px;}
  .board{
    position:relative; display:grid;
    grid-template-columns:repeat(11,1fr); grid-template-rows:repeat(11,1fr);
    aspect-ratio:1/1; background:#fff; border-radius:20px; padding:10px;
    box-shadow:0 10px 30px rgba(60,110,160,.18);
  }
  .cell{
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    border-radius:10px;margin:3px;font-size:13px;font-weight:700;color:#5b6b7a;
    background:#f1f7fc; position:relative; user-select:none;
  }
  .cell .ic{font-size:17px;line-height:1;}
  .cell .no{position:absolute;top:2px;left:4px;font-size:9px;color:#9fb2c2;font-weight:600;}
  .cell.start{background:#e6fbf0;color:#1f8b4c;border:2px solid #9fe3bd;}
  .cell.end{background:#ffe9ec;color:#d23b4b;border:2px solid #ffb3bb;}
  .cell.reward{background:#fff6da;color:#b98900;border:2px solid #ffe08a;}
  .cell.q-spell{background:#fff0e6;color:#d9661f;border:2px solid #ffc7a3;}
  .cell.q-mean{background:#e6faf4;color:#159e7e;border:2px solid #a7ecd9;}
  .cell.q-gram{background:#efeaff;color:#6c4fd6;border:2px solid #cdbcff;}
  .center-panel{
    grid-row:2 / 11; grid-column:2 / 11; border-radius:16px;
    background:linear-gradient(160deg,#eaf6ff,#f7fbff);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:10px;box-shadow:inset 0 0 0 2px #e3eefb;
  }
  .center-panel .big{font-size:30px;}
  .center-panel h2{margin:6px 0 2px;font-size:16px;color:#2b6fb0;}
  .center-panel .sub{font-size:11px;color:#7c8c9a;margin-bottom:8px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:230px;}
  .legend span{font-size:11px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:3px 8px;color:#5b6b7a;}

  .piece{
    position:absolute; left:0; top:0; font-size:26px; z-index:5;
    transform:translate(-50%,-50%); transition:left .22s ease,top .22s ease;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); pointer-events:none;
  }

  .side{flex:1 1 280px;max-width:360px;display:flex;flex-direction:column;gap:14px;}
  .panel{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(60,110,160,.12);}
  .panel h3{margin:0 0 8px;font-size:15px;color:#2b6fb0;}
  .panel ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#4a5a6a;}
  .dice-area{display:flex;align-items:center;gap:16px;justify-content:center;}
  .die{
    width:72px;height:72px;border-radius:16px;background:linear-gradient(145deg,#fff,#e9f2fa);
    box-shadow:0 6px 14px rgba(60,110,160,.25),inset 0 0 0 2px #dcebf8;
    display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#2b6fb0;
  }
  .die.rolling{animation:wob .4s infinite;}
  @keyframes wob{0%{transform:rotate(-8deg) scale(.96);}50%{transform:rotate(8deg) scale(1.04);}100%{transform:rotate(-8deg) scale(.96);}}
  button.act{
    border:none;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(145deg,#4fb0ff,#2b8fe6);cursor:pointer;box-shadow:0 5px 14px rgba(43,143,230,.35);
    transition:transform .1s;
  }
  button.act:active{transform:translateY(2px);}
  button.act:disabled{opacity:.5;cursor:not-allowed;}
  button.ghost{background:#eef4fa;color:#2b6fb0;box-shadow:none;border:1px solid #d4e4f2;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(35,55,75,.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:22px;
    box-shadow:0 18px 50px rgba(20,40,60,.35);animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;padding:4px 10px;border-radius:20px;margin-bottom:10px;}
  .modal h4{margin:0 0 12px;font-size:19px;}
  .modal .q-text{font-size:17px;line-height:1.6;margin-bottom:14px;}
  .modal .q-word{font-size:30px;font-weight:800;color:#2b6fb0;text-align:center;margin:6px 0 14px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{border:2px solid #e3eefb;background:#f7fbff;border-radius:12px;padding:11px 14px;font-size:15px;
    text-align:left;cursor:pointer;transition:.12s;color:#33454f;}
  .opt:hover{border-color:#9fd0ff;background:#eef7ff;}
  .opt.correct{border-color:#27c19a;background:#e6faf4;color:#159e7e;font-weight:700;}
  .opt.wrong{border-color:#ff8a96;background:#ffeef0;color:#d23b4b;font-weight:700;}
  input.type{width:100%;padding:13px 14px;font-size:17px;border:2px solid #e3eefb;border-radius:12px;outline:none;}
  input.type:focus{border-color:#4fb0ff;}
  .feedback{margin-top:14px;font-size:14px;line-height:1.6;padding:10px 12px;border-radius:10px;display:none;}
  .feedback.ok{display:block;background:#e6faf4;color:#159e7e;}
  .feedback.no{display:block;background:#ffeef0;color:#d23b4b;}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#2b3a4a;color:#fff;
    padding:10px 18px;border-radius:30px;font-size:14px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .mute-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#5b6b7a;justify-content:center;}
  @media(max-width:560px){.center-panel .big{font-size:22px;}.cell{font-size:11px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✈️ 飞行单词棋</h1>
    <p>掷骰子 · 闯格子 · 八年级上册英语词汇与语法大挑战（人教版 Go for it!）</p>
  </header>

  <div class="hud">
    <div class="stat score"><div class="num" id="scoreNum">0</div><div class="lab">得分</div></div>
    <div class="stat prog"><div class="num" id="progNum">0/39</div><div class="lab">进度</div></div>
    <div class="stat acc"><div class="num" id="accNum">—</div><div class="lab">正确率</div></div>
  </div>

  <div class="game">
    <div class="board-box">
      <div class="board" id="board">
        <div class="center-panel">
          <div class="big">🛫🌤️🛬</div>
          <h2>飞行单词棋</h2>
          <div class="sub">从 🚩 出发，抵达 🏁 即获胜！</div>
          <div class="legend">
            <span>🚩 起点</span><span>🏁 终点</span><span>🎁 奖励格</span>
            <span>✏️ 拼写</span><span>🔤 词义</span><span>📘 语法</span>
          </div>
        </div>
        <div class="piece" id="piece">🛩️</div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="dice-area">
          <button class="act" id="rollBtn">🎲 投掷骰子</button>
          <div class="die" id="die">?</div>
        </div>
        <div class="mute-row" style="margin-top:12px;">
          <label><input type="checkbox" id="muteChk" /> 关闭音效</label>
        </div>
      </div>

      <div class="panel">
        <h3>📘 玩法说明</h3>
        <ul>
          <li>点击「投掷骰子」，棋子按点数前进。</li>
          <li>落到 <b>✏️拼写 / 🔤词义 / 📘语法</b> 格，回答对应题目。</li>
          <li><b>答对</b>：+10 分，并奖励前进 1 格 🎉</li>
          <li><b>答错</b>：显示正确答案，后退 2 格</li>
          <li>落到 <b>🎁奖励格</b>：直接 +5 分并前进 1 格</li>
          <li>率先抵达 <b>🏁 第 39 格</b> 即闯关成功！</li>
        </ul>
      </div>

      <div class="panel">
        <button class="act ghost" id="restartBtn" style="width:100%">🔄 重新开始</button>
      </div>
    </div>
  </div>
</div>

<!-- Question Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 题库 ===================== */
const spellingPool = [
  {q:"任何人（不定代词）", a:["anyone","anybody"]},
  {q:"家务劳动", a:["housework"]},
  {q:"几乎不", a:["hardly"]},
  {q:"两次；两倍", a:["twice"]},
  {q:"精彩的；极好的", a:["wonderful"]},
  {q:"日记；记事簿", a:["diary"]},
  {q:"活动", a:["activity"]},
  {q:"决定；选定", a:["decide"]},
  {q:"舒适的；舒服的", a:["comfortable"]},
  {q:"记者", a:["reporter"]},
  {q:"有教育意义的", a:["educational"]},
  {q:"工程师", a:["engineer"]},
  {q:"科学家", a:["scientist"]},
  {q:"污染；污染物", a:["pollution"]},
  {q:"环境", a:["environment"]},
  {q:"行星", a:["planet"]},
  {q:"搅拌器；果汁机", a:["blender"]},
  {q:"酸奶", a:["yogurt","yoghurt"]},
  {q:"传统的；惯例的", a:["traditional"]},
  {q:"邀请", a:["invite"]},
  {q:"拒绝", a:["refuse"]},
  {q:"建议；意见（不可数）", a:["advice"]},
  {q:"组织；筹备", a:["organize","organise"]},
  {q:"宇航员", a:["astronaut"]},
  {q:"代理人；经纪人", a:["agent"]}
];

const meaningPool = [
  {word:"housework", opts:["家务劳动","家庭作业","房子","作业"], ans:"家务劳动"},
  {word:"hardly", opts:["几乎不","努力地","困难地","几乎"], ans:"几乎不"},
  {word:"outgoing", opts:["外向的","内向的","离开的","幽默的"], ans:"外向的"},
  {word:"comfortable", opts:["舒适的","便宜的","干净的","拥挤的"], ans:"舒适的"},
  {word:"fantastic", opts:["极好的","可怕的","幻想的","疲劳的"], ans:"极好的"},
  {word:"educational", opts:["有教育意义的","娱乐的","音乐的","科学的"], ans:"有教育意义的"},
  {word:"engineer", opts:["工程师","科学家","飞行员","医生"], ans:"工程师"},
  {word:"pollution", opts:["污染","人口","保护","解决"], ans:"污染"},
  {word:"environment", opts:["环境","实验","政府","发展"], ans:"环境"},
  {word:"astronaut", opts:["宇航员","天文学家","飞行员","军人"], ans:"宇航员"},
  {word:"blender", opts:["搅拌器","洗衣机","烤炉","冰箱"], ans:"搅拌器"},
  {word:"traditional", opts:["传统的","现代的","流行的","国际的"], ans:"传统的"},
  {word:"invite", opts:["邀请","发明","投资","涉及"], ans:"邀请"},
  {word:"refuse", opts:["拒绝","接受","回复","准备"], ans:"拒绝"},
  {word:"advice", opts:["建议","广告","观点","优势"], ans:"建议"},
  {word:"although", opts:["虽然；尽管","即使","因为","所以"], ans:"虽然；尽管"}
];

const grammarPool = [
  {text:"I ___ to the mountains last summer.", opts:["go","went","going","goes"], ans:"went", why:"last summer 是过去时间，动词用一般过去式 went。"},
  {text:"She is ___ than her sister.", opts:["tall","taller","tallest","the tallest"], ans:"taller", why:"than 表示两者比较，用比较级 taller。"},
  {text:"He ___ TV every evening.", opts:["watch","watches","watching","watched"], ans:"watches", why:"主语 he 是第三人称单数，一般现在时动词加 -s。"},
  {text:"They are going to ___ a new library.", opts:["build","built","building","builds"], ans:"build", why:"be going to 后接动词原形。"},
  {text:"If it rains tomorrow, we ___ stay at home.", opts:["will","would","are","do"], ans:"will", why:"if 条件句中，主句用一般将来时 will + 动词原形。"},
  {text:"There ___ some milk in the glass.", opts:["is","are","be","am"], ans:"is", why:"milk 是不可数名词，be 动词用 is。"},
  {text:"He can ___ English very well.", opts:["speak","speaks","spoke","speaking"], ans:"speak", why:"情态动词 can 后接动词原形。"},
  {text:"This is the ___ film I have ever seen.", opts:["good","better","best","well"], ans:"best", why:"the ... I have ever seen 用最高级 best。"},
  {text:"I have ___ homework to do today.", opts:["many","much","a lot","few"], ans:"much", why:"homework 是不可数名词，用 much 修饰。"},
  {text:"She usually ___ up at 6:00 a.m.", opts:["get","gets","got","getting"], ans:"gets", why:"usually 表经常，主语 she 用第三人称单数 gets。"},
  {text:"We ___ a picnic if it is fine this Sunday.", opts:["will have","have","has","having"], ans:"will have", why:"if 条件句主句用一般将来时。"},
  {text:"He is interested ___ science.", opts:["in","on","at","of"], ans:"in", why:"固定搭配 be interested in（对……感兴趣）。"},
  {text:"—___ do you exercise? —Three times a week.", opts:["How often","How long","How far","How many"], ans:"How often", why:"答语是频率，用 How often 提问。"},
  {text:"This book is ___ than that one.", opts:["interesting","more interesting","most interesting","interestinger"], ans:"more interesting", why:"多音节词比较级用 more + 原级。"},
  {text:"I look forward to ___ you soon.", opts:["see","seeing","saw","seen"], ans:"seeing", why:"look forward to 中 to 是介词，后接动名词 seeing。"},
  {text:"There will be ___ pollution in the future.", opts:["less","fewer","little","few"], ans:"less", why:"pollution 不可数，比较级用 less。"}
];

/* 每类题库循环指针，避免连续重复 */
const pointers = {spelling:0, meaning:0, grammar:0};
function nextQ(type){
  const pool = type==='spelling'?spellingPool : type==='meaning'?meaningPool : grammarPool;
  const p = pointers[type];
  pointers[type] = (p+1)%pool.length;
  return pool[p];
}

/* ===================== 棋盘 ===================== */
const N = 11;            // 11x11 网格
const TOTAL = 40;        // 周长格子数 4*11-4
const REWARD = new Set([4,11,18,25,32]);
const END = 39;
let track = [];          // 每个格子的 {r,c}
(function buildTrack(){
  // 顺时针：上边 → 右边 → 下边 → 左边
  for(let c=0;c<N;c++) track.push({r:0,c});
  for(let r=1;r<N;r++) track.push({r,c:N-1});
  for(let c=N-2;c>=0;c--) track.push({r:N-1,c});
  for(let r=N-2;r>=1;r--) track.push({r,c:0});
})();

const board = document.getElementById('board');
const piece = document.getElementById('piece');
const cellEls = [];
function cellType(i){
  if(i===0) return 'start';
  if(i===END) return 'end';
  if(REWARD.has(i)) return 'reward';
  const t = i%3;
  return t===0?'q-spell': t===1?'q-mean':'q-gram';
}
function cellIcon(i){
  if(i===0) return '🚩';
  if(i===END) return '🏁';
  if(REWARD.has(i)) return '🎁';
  const t = i%3;
  return t===0?'✏️': t===1?'🔤':'📘';
}
(function renderBoard(){
  // 起点优先，保证 0 号格子在最上面（已按 track 顺序）
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='cell '+cellType(i);
    d.style.gridRow=(track[i].r+1);
    d.style.gridColumn=(track[i].c+1);
    d.innerHTML='<span class="no">'+(i===0?'':i)+'</span><span class="ic">'+cellIcon(i)+'</span>';
    board.insertBefore(d, piece);
    cellEls.push(d);
  }
})();

let centers=[];
function computeCenters(){
  centers=[];
  for(let i=0;i<TOTAL;i++){
    const el=cellEls[i];
    centers.push({x:el.offsetLeft+el.offsetWidth/2, y:el.offsetTop+el.offsetHeight/2});
  }
}
function setPiece(i){
  piece.style.left = centers[i].x+'px';
  piece.style.top  = centers[i].y+'px';
}
window.addEventListener('load',()=>{computeCenters(); setPiece(0);});
window.addEventListener('resize',()=>{computeCenters(); setPiece(pos);});

/* ===================== 状态 ===================== */
let pos=0, score=0, answered=0, correctCount=0, locked=false, lastCorrect=false;
const scoreNum=document.getElementById('scoreNum');
const progNum=document.getElementById('progNum');
const accNum=document.getElementById('accNum');
const rollBtn=document.getElementById('rollBtn');
const dieEl=document.getElementById('die');
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');
const toastEl=document.getElementById('toast');

function updateHUD(){
  scoreNum.textContent=score;
  progNum.textContent=pos+'/'+END;
  accNum.textContent = answered? Math.round(correctCount/answered*100)+'%' : '—';
}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),1800);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 简易音效 */
let audioCtx=null;
function playTone(freq){
  if(document.getElementById('muteChk').checked) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=freq; o.type='sine';
    g.gain.value=0.08; o.connect(g); g.connect(audioCtx.destination);
    o.start(); setTimeout(()=>{o.stop();},180);
  }catch(e){}
}

/* ===================== 移动动画 ===================== */
async function animateTo(target){
  const dir = target>pos?1:-1;
  while(pos!==target){
    pos+=dir; setPiece(pos); await sleep(210);
  }
}
function animateDice(final){
  return new Promise(res=>{
    dieEl.classList.add('rolling');
    let n=0;
    const id=setInterval(()=>{ dieEl.textContent=(1+Math.floor(Math.random()*6)); n++; },70);
    setTimeout(()=>{ clearInterval(id); dieEl.classList.remove('rolling'); dieEl.textContent=final; res(); },620);
  });
}

/* ===================== 主流程 ===================== */
async function rollDice(){
  if(locked) return;
  locked=true; rollBtn.disabled=true;
  const v = 1+Math.floor(Math.random()*6);
  await animateDice(v);
  const target=Math.min(pos+v,END);
  await animateTo(target);
  await handleCell();
}

async function handleCell(){
  if(pos===END){ win(); return; }
  if(REWARD.has(pos)){
    score+=5; updateHUD();
    toast('🎁 幸运格！+5 分，前进 1 格');
    playTone(880);
    await animateTo(Math.min(pos+1,END));
    if(pos===END){ win(); return; }
    unlock(); return;
  }
  openQuestion();   // 题目格：打开弹窗，等待用户作答
}

function unlock(){ locked=false; rollBtn.disabled=false; }

/* ===================== 题目弹窗 ===================== */
function openModal(html){ modal.innerHTML=html; overlay.classList.add('show'); }
function closeModal(){ overlay.classList.remove('show'); }

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function openQuestion(){
  const t = pos%3;
  if(t===0) renderSpelling();
  else if(t===1) renderMeaning();
  else renderGrammar();
}

function showResult(ok, msg, extra){
  lastCorrect=ok;
  answered++; if(ok) correctCount++;
  updateHUD();
  const box=document.getElementById('feedback');
  box.className='feedback '+(ok?'ok':'no');
  box.innerHTML=(ok?'✅ ':'❌ ')+msg+(extra?'<br><span style="opacity:.85">'+extra+'</span>':'');
  box.style.display='block';
  document.getElementById('continueBtn').style.display='inline-block';
  playTone(ok?660:200);
}

function renderSpelling(){
  const q=nextQ('spelling');
  openModal(`
    <span class="tag" style="background:var(--spell)">✏️ 单词拼写</span>
    <h4>请根据中文意思拼写出英语单词：</h4>
    <div class="q-word">${q.q}</div>
    <input class="type" id="ans" placeholder="在此输入英文，按回车或点提交" autocomplete="off">
    <div class="feedback" id="feedback"></div>
    <div class="row">
      <button class="act" id="submitBtn">提交</button>
      <button class="act" id="continueBtn" style="display:none">继续 ➜</button>
    </div>
  `);
  const input=document.getElementById('ans');
  input.focus();
  function submit(){
    const val=input.value.trim().toLowerCase().replace(/[.;！!，,。\s]+$/g,'');
    if(!val){ input.focus(); return; }
    const ok=q.a.includes(val);
    document.getElementById('submitBtn').style.display='none';
    showResult(ok, ok?'拼写正确！':'正确答案：'+q.a.join(' / '));
  }
  document.getElementById('submitBtn').onclick=submit;
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
  document.getElementById('continueBtn').onclick=postAnswer;
}

function renderMeaning(){
  const q=nextQ('meaning');
  const opts=shuffle(q.opts);
  openModal(`
    <span class="tag" style="background:var(--mean)">🔤 词义选择</span>
    <h4>选出下列单词的正确中文意思：</h4>
    <div class="q-word">${q.word}</div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="row"><button class="act" id="continueBtn" style="display:none">继续 ➜</button></div>
  `);
  const box=document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      if(box.dataset.done) return; box.dataset.done='1';
      const ok = (o===q.ans);
      [...box.children].forEach(c=>{
        if(c.textContent===q.ans) c.classList.add('correct');
        else if(c===b) c.classList.add('wrong');
      });
      showResult(ok, ok?'选择正确！':'正确答案：'+q.ans);
    };
    box.appendChild(b);
  });
  document.getElementById('continueBtn').onclick=postAnswer;
}

function renderGrammar(){
  const q=nextQ('grammar');
  const opts=shuffle(q.opts);
  openModal(`
    <span class="tag" style="background:var(--gram)">📘 语法填空</span>
    <h4>选择最恰当的词完成句子：</h4>
    <div class="q-text">${q.text.replace('___','<u>&nbsp;___&nbsp;</u>')}</div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="row"><button class="act" id="continueBtn" style="display:none">继续 ➜</button></div>
  `);
  const box=document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      if(box.dataset.done) return; box.dataset.done='1';
      const ok = (o===q.ans);
      [...box.children].forEach(c=>{
        if(c.textContent===q.ans) c.classList.add('correct');
        else if(c===b) c.classList.add('wrong');
      });
      showResult(ok, ok?'语法正确！':'正确答案：'+q.ans, q.why);
    };
    box.appendChild(b);
  });
  document.getElementById('continueBtn').onclick=postAnswer;
}

async function postAnswer(){
  closeModal();
  if(lastCorrect){ await animateTo(Math.min(pos+1,END)); }
  else { await animateTo(Math.max(pos-2,0)); }
  if(pos===END){ win(); return; }
  unlock();
}

/* ===================== 胜利 / 重开 ===================== */
function win(){
  locked=true; rollBtn.disabled=true;
  const acc = answered? Math.round(correctCount/answered*100):0;
  openModal(`
    <div style="text-align:center">
      <div style="font-size:54px">🏆</div>
      <h4 style="margin:6px 0 4px">闯关成功！</h4>
      <p style="color:#5b6b7a;margin:0 0 10px">你抵达了 🏁 第 ${END} 格！</p>
      <div style="display:flex;gap:10px;justify-content:center;margin:10px 0">
        <div class="stat score" style="min-width:84px"><div class="num">${score}</div><div class="lab">总得分</div></div>
        <div class="stat acc" style="min-width:84px"><div class="num">${acc}%</div><div class="lab">正确率</div></div>
        <div class="stat prog" style="min-width:84px"><div class="num">${correctCount}/${answered}</div><div class="lab">答对题数</div></div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="act" id="againBtn">🔄 再玩一次</button>
      </div>
    </div>
  `);
  document.getElementById('againBtn').onclick=restart;
}

function restart(){
  pos=0; score=0; answered=0; correctCount=0; lastCorrect=false;
  pointers.spelling=0; pointers.meaning=0; pointers.grammar=0;
  closeModal(); setPiece(0); updateHUD();
  dieEl.textContent='?'; unlock();
  toast('已重新开始，祝你好运！');
}

/* ===================== 事件 ===================== */
rollBtn.addEventListener('click',rollDice);
document.getElementById('restartBtn').addEventListener('click',restart);
updateHUD();
</script>
</body>
</html>
